services:
  db:
    image: postgres:17-alpine
    container_name: agritrust-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agritrust
      POSTGRES_USER: agritrust
      POSTGRES_PASSWORD: agritrust
    ports:
      - "5432:5432"
    volumes:
      - agritrust_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agritrust -d agritrust"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agritrust_pgdata:
